[project]
name = "mirror-backend"
version = "0.1.0"
description = "Project MIRROR simulation backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "openai>=2,<3",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: external service integration",
  "paid: consumes paid model API",
  "external: requires network access",
]

